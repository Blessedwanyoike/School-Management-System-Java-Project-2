spring.application.name=carol-academy-portal
server.port=8080
server.address=127.0.0.1
logging.file.name=logs/carol-academy.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=100MB

spring.datasource.url=jdbc:h2:file:./data/carol-academy-portal;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=false

app.seed-data.enabled=true
app.seed-data.password=${APP_SEED_DATA_PASSWORD}
