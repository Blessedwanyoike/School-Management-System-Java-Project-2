<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${moduleName + ' | Carol Academy'}">Module | Carol Academy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/modules}">
        <img class="school-logo" th:src="@{/images/carol-academy-logo.jpg}" alt="Carol Academy crest">
        <span><strong>Carol Academy</strong><small>School module</small></span>
    </a>
    <div class="account">
        <a class="button outline" th:href="@{/modules}">All modules</a>
        <form th:action="@{/logout}" method="post"><button class="button outline" type="submit">Sign out</button></form>
    </div>
</header>
<main class="container">
    <section class="page-heading">
        <p class="eyebrow">WORKFLOW SECTION</p>
        <h1 th:text="${moduleName}">Module name</h1>
        <p class="muted">Create and review operational records for this department.</p>
    </section>
    <div class="alert success" th:if="${message}" th:text="${message}"></div>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>
    <section class="panel">
        <div class="panel-heading"><div><p class="eyebrow">NEW RECORD</p><h2>Add entry</h2></div></div>
        <form th:action="@{/modules/{section}/add(section=${section})}" method="post" class="form-stack">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label for="record-title">Title / learner / item</label>
            <input id="record-title" name="title" maxlength="200" required>
            <label for="record-reference">Reference / number / admission / route</label>
            <input id="record-reference" name="reference" maxlength="500">
            <label for="record-details">Details / notes</label>
            <textarea id="record-details" name="details" maxlength="2000" rows="4"></textarea>
            <label for="record-status">Status</label>
            <input id="record-status" name="status" maxlength="100" value="Active">
            <button class="button primary" type="submit">Save record</button>
        </form>
    </section>
    <section class="panel">
        <div class="panel-heading"><div><p class="eyebrow">RECENT ENTRIES</p><h2>Records</h2></div></div>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Date</th><th>Title</th><th>Reference</th><th>Details</th><th>Status</th></tr></thead>
                <tbody>
                <tr th:each="record : ${records}">
                    <td th:text="${#temporals.format(record.createdAt, 'dd MMM yyyy, HH:mm')}">Date</td>
                    <td th:text="${record.title}">Title</td>
                    <td th:text="${record.reference != '' ? record.reference : '—'}">Reference</td>
                    <td th:text="${record.details != '' ? record.details : '—'}">Details</td>
                    <td th:text="${record.status}">Status</td>
                </tr>
                <tr th:if="${#lists.isEmpty(records)}"><td colspan="5" class="empty">No records saved yet.</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
